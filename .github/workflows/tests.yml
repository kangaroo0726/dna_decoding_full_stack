name: Tests

on:
  push:
    paths:
      - "api/**"
      - "decoder/**"
      - "tests/**"
      - "frontend/**"
      - ".github/workflows/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "api/**"
      - "decoder/**"
      - "tests/**"
      - "frontend/**"
      - ".github/workflows/**"
      - "requirements.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dna_decoder
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dna_decoder
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dna_decoder"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Create database tables
        run: python api/create_tables.py

      - name: Run backend tests
        run: pytest -q tests

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend production build
        working-directory: frontend
        run: npm run build
